<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1170" viewBox="0 0 1600 1170">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 16px; fill: #475569; }
      .h { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .t { font-size: 13px; fill: #334155; }
      .s { font-size: 12px; fill: #64748b; }
      .m { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13.5px; font-weight: 700; fill: #1e293b; }
      .ms { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; fill: #334155; }
      .line { stroke: #475569; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <rect width="1600" height="1170" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="56" class="title">AI Knowledge Inbox: how the repo works</text>
  <text x="40" y="86" class="sub">Save notes and URLs → split and embed them → ask a question → get an answer that cites the saved sources</text>

  <!-- ===================== Frontend ===================== -->
  <rect x="40" y="120" width="300" height="760" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="60" y="152" class="h">Frontend · client/</text>
  <text x="60" y="172" class="s">React 19 + Vite + TypeScript · localhost:5173</text>

  <rect x="60" y="195" width="260" height="92" rx="10" fill="#fff" stroke="#93c5fd"/>
  <text x="74" y="222" class="m">AddItemForm</text>
  <text x="74" y="245" class="t">Save a text note or a URL</text>
  <text x="74" y="266" class="s">says it will be processed in the background</text>

  <rect x="60" y="305" width="260" height="92" rx="10" fill="#fff" stroke="#93c5fd"/>
  <text x="74" y="332" class="m">ItemList</text>
  <text x="74" y="355" class="t">Items with status and a preview</text>
  <text x="74" y="376" class="s">polls every 2s while something is pending</text>

  <rect x="60" y="415" width="260" height="92" rx="10" fill="#fff" stroke="#93c5fd"/>
  <text x="74" y="442" class="m">AskPanel</text>
  <text x="74" y="465" class="t">Question → answer + sources</text>
  <text x="74" y="486" class="s">cited sources are highlighted</text>

  <rect x="60" y="525" width="260" height="80" rx="10" fill="#fff" stroke="#93c5fd"/>
  <text x="74" y="552" class="m">useItems · useAskQuestion</text>
  <text x="74" y="575" class="t">State and polling live in hooks</text>

  <rect x="60" y="625" width="260" height="92" rx="10" fill="#fff" stroke="#93c5fd"/>
  <text x="74" y="652" class="m">api/client.ts</text>
  <text x="74" y="675" class="t">Typed calls to the 3 endpoints</text>
  <text x="74" y="696" class="s">turns API errors into readable messages</text>

  <text x="60" y="752" class="s">In development, Vite forwards /ingest, /items</text>
  <text x="60" y="770" class="s">and /query to the API on port 3001.</text>

  <!-- ===================== API ===================== -->
  <rect x="380" y="120" width="280" height="760" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="400" y="152" class="h">API · server/src/http</text>
  <text x="400" y="172" class="s">Express 5 + TypeScript · port 3001</text>

  <rect x="400" y="195" width="240" height="120" rx="10" fill="#fff" stroke="#a78bfa"/>
  <text x="414" y="222" class="m">POST /ingest</text>
  <text x="414" y="245" class="ms">{ type: "note", text }</text>
  <text x="414" y="264" class="ms">{ type: "url", url }</text>
  <text x="414" y="285" class="s">→ 202 { id, status: "pending" }</text>
  <text x="414" y="303" class="s">→ 400 if the input is invalid</text>

  <rect x="400" y="335" width="240" height="95" rx="10" fill="#fff" stroke="#a78bfa"/>
  <text x="414" y="362" class="m">GET /items</text>
  <text x="414" y="385" class="t">Metadata + 200-char preview</text>
  <text x="414" y="406" class="s">newest first, no full content</text>

  <rect x="400" y="450" width="240" height="120" rx="10" fill="#fff" stroke="#a78bfa"/>
  <text x="414" y="477" class="m">POST /query</text>
  <text x="414" y="500" class="ms">{ question }</text>
  <text x="414" y="521" class="s">→ 200 { answer, sources[] }</text>
  <text x="414" y="540" class="s">→ 400 empty question</text>
  <text x="414" y="559" class="s">→ 502 if OpenAI fails</text>

  <rect x="400" y="590" width="240" height="150" rx="10" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="414" y="617" class="h">Every request</text>
  <text x="414" y="642" class="s">Zod validation → 400 + details</text>
  <text x="414" y="664" class="s">same error shape everywhere:</text>
  <text x="414" y="684" class="ms">{ error: { code, message } }</text>
  <text x="414" y="706" class="s">pino structured JSON logs</text>
  <text x="414" y="726" class="s">unknown route → 404 JSON</text>

  <text x="400" y="770" class="s">index.ts wires everything together;</text>
  <text x="400" y="788" class="s">config.ts validates settings from .env</text>

  <!-- Frontend → API arrows -->
  <line x1="322" y1="241" x2="397" y2="252" class="line" marker-end="url(#arrow)"/>
  <line x1="322" y1="351" x2="397" y2="381" class="line" marker-end="url(#arrow)"/>
  <line x1="322" y1="461" x2="397" y2="505" class="line" marker-end="url(#arrow)"/>

  <!-- ===================== Lane 1: Ingestion ===================== -->
  <rect x="700" y="120" width="860" height="330" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="720" y="152" class="h">1 · Ingestion (runs in the background)</text>
  <text x="720" y="172" class="s">server/src/ingest · starts after POST /ingest has already returned 202</text>

  <rect x="720" y="195" width="195" height="150" rx="10" fill="#fff" stroke="#34d399"/>
  <text x="734" y="222" class="m">IngestService</text>
  <text x="734" y="245" class="t">In-process queue</text>
  <text x="734" y="266" class="t">One item at a time</text>
  <text x="734" y="290" class="s">Re-queues pending items</text>
  <text x="734" y="308" class="s">after a restart</text>

  <rect x="930" y="195" width="195" height="150" rx="10" fill="#fff" stroke="#34d399"/>
  <text x="944" y="222" class="m">UrlFetcher</text>
  <text x="944" y="245" class="t">URL items only</text>
  <text x="944" y="268" class="s">http(s) only, no credentials</text>
  <text x="944" y="286" class="s">blocks private/local IPs</text>
  <text x="944" y="304" class="s">≤3 redirects · 10s · 2 MB</text>
  <text x="944" y="322" class="s">Readability → article text</text>

  <rect x="1140" y="195" width="195" height="150" rx="10" fill="#fff" stroke="#34d399"/>
  <text x="1154" y="222" class="m">Chunker</text>
  <text x="1154" y="245" class="t">Split on paragraphs</text>
  <text x="1154" y="266" class="t">Pack to ≤ 1500 chars</text>
  <text x="1154" y="290" class="s">200-char overlap so ideas</text>
  <text x="1154" y="308" class="s">aren't cut at a boundary</text>

  <rect x="1350" y="195" width="195" height="150" rx="10" fill="#fefce8" stroke="#eab308"/>
  <text x="1364" y="222" class="m">Embed (OpenAI)</text>
  <text x="1364" y="245" class="t">Header + chunk text</text>
  <text x="1364" y="268" class="s">header: title, links, sites</text>
  <text x="1364" y="286" class="s">text-embedding-3-small</text>
  <text x="1364" y="304" class="s">batches of 100</text>

  <line x1="917" y1="270" x2="927" y2="270" class="line" marker-end="url(#arrow)"/>
  <line x1="1127" y1="270" x2="1137" y2="270" class="line" marker-end="url(#arrow)"/>
  <line x1="1337" y1="270" x2="1347" y2="270" class="line" marker-end="url(#arrow)"/>
  <text x="740" y="382" class="t">✓ Success: status "ready", chunks saved, card shows a preview</text>
  <text x="740" y="406" class="t">✗ Failure: status "failed", the error appears on the card</text>
  <text x="740" y="430" class="s">Notes skip UrlFetcher and go straight to the Chunker.</text>

  <!-- API → ingestion -->
  <path d="M642,255 C672,255 690,270 717,270" class="line" marker-end="url(#arrow)"/>

  <!-- ===================== Store ===================== -->
  <rect x="700" y="470" width="860" height="90" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="720" y="500" class="h">SQLite · data/inbox.db</text>
  <text x="720" y="524" class="t">items: id, type, title, URL, raw content, status, error, created time</text>
  <text x="720" y="545" class="t">chunks: item id, position, text, embedding (Float32 vector) · server/src/store holds all SQL</text>

  <!-- Embed → store, store → retrieve -->
  <line x1="1447" y1="347" x2="1447" y2="467" class="line" marker-end="url(#arrow)"/>
  <text x="1457" y="420" class="s">write</text>
  <!-- GET /items reads the store -->
  <path d="M642,382 C680,382 680,505 697,505" class="line" marker-end="url(#arrow)"/>

  <!-- ===================== Lane 2: Query ===================== -->
  <rect x="700" y="580" width="860" height="300" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="720" y="612" class="h">2 · Answering a question</text>
  <text x="720" y="632" class="s">server/src/search · POST /query</text>

  <rect x="720" y="655" width="195" height="140" rx="10" fill="#fefce8" stroke="#eab308"/>
  <text x="734" y="682" class="m">Embed question</text>
  <text x="734" y="705" class="t">Same embedding model</text>
  <text x="734" y="728" class="s">one OpenAI call</text>

  <rect x="930" y="655" width="195" height="140" rx="10" fill="#fff" stroke="#fb923c"/>
  <text x="944" y="682" class="m">Retrieve</text>
  <text x="944" y="705" class="t">Cosine vs all chunks</text>
  <text x="944" y="728" class="s">keep score ≥ 0.15</text>
  <text x="944" y="746" class="s">take the top 5</text>

  <rect x="1140" y="655" width="195" height="140" rx="10" fill="#fff" stroke="#fb923c"/>
  <text x="1154" y="682" class="m">Nothing relevant?</text>
  <text x="1154" y="705" class="t">Return a fixed reply</text>
  <text x="1154" y="728" class="s">"couldn't find anything</text>
  <text x="1154" y="746" class="s">relevant", no LLM call</text>

  <rect x="1350" y="655" width="195" height="140" rx="10" fill="#fefce8" stroke="#eab308"/>
  <text x="1364" y="682" class="m">Answer (OpenAI)</text>
  <text x="1364" y="705" class="t">gpt-4o-mini</text>
  <text x="1364" y="728" class="s">numbered sources [1]…[5]</text>
  <text x="1364" y="746" class="s">answer only from sources</text>
  <text x="1364" y="764" class="s">cite them as [n]</text>

  <line x1="917" y1="725" x2="927" y2="725" class="line" marker-end="url(#arrow)"/>
  <line x1="1127" y1="725" x2="1137" y2="725" class="line" marker-end="url(#arrow)"/>
  <line x1="1337" y1="725" x2="1347" y2="725" class="line" marker-end="url(#arrow)"/>

  <text x="720" y="830" class="t">Response: answer + sources (title, snippet, score, citedInAnswer) → AskPanel highlights the cited ones</text>
  <text x="720" y="854" class="s">Saved page text is treated as data: instructions inside a saved page are ignored by the prompt.</text>

  <!-- API → query lane -->
  <path d="M642,510 C690,510 680,725 717,725" class="line" marker-end="url(#arrow)"/>

  <!-- Store → Retrieve (drawn after the lane so it stays visible) -->
  <line x1="1027" y1="562" x2="1027" y2="652" class="line" marker-end="url(#arrow)"/>
  <text x="1037" y="622" class="s">reads all ready chunks</text>

  <!-- ===================== Repo map ===================== -->
  <rect x="40" y="910" width="1520" height="230" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="942" class="h">Repo map</text>

  <text x="60" y="974" class="m">server/src/</text>
  <text x="60" y="997" class="t">index.ts · wires everything together</text>
  <text x="60" y="1017" class="t">config.ts · validated settings from .env</text>
  <text x="60" y="1037" class="t">http/ · app, routes, schemas, validation</text>
  <text x="60" y="1057" class="t">ingest/ · chunker, urlFetcher, embeddingText, ingestService</text>
  <text x="60" y="1077" class="t">search/ · vectorMath (cosine), answerService</text>
  <text x="60" y="1097" class="t">store/ · SQLite schema and repositories</text>
  <text x="60" y="1117" class="t">ai/ · OpenAI behind an AiProvider interface</text>

  <text x="620" y="974" class="m">client/src/</text>
  <text x="620" y="997" class="t">App.tsx · two-column layout</text>
  <text x="620" y="1017" class="t">components/ · AddItemForm, ItemList, AskPanel</text>
  <text x="620" y="1037" class="t">hooks/ · useItems (polling), useAskQuestion</text>
  <text x="620" y="1057" class="t">api/client.ts · typed API calls</text>
  <text x="620" y="1077" class="t">styles.css · light and dark theme</text>

  <text x="1100" y="974" class="m">Run and test</text>
  <text x="1100" y="997" class="ms">npm run install:all</text>
  <text x="1100" y="1017" class="ms">server/.env ← OPENAI_API_KEY</text>
  <text x="1100" y="1037" class="ms">npm run dev → localhost:5173</text>
  <text x="1100" y="1057" class="ms">npm test → 48 tests</text>
  <text x="1100" y="1077" class="t">Tests use a fake AI, so no key needed</text>
  <text x="1100" y="1097" class="t">README: design decisions and tradeoffs</text>
</svg>
